name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Gate tests (real ffmpeg format matrix, fake engines)
        run: python -m pytest -q

  image:
    # x86-64 carries both engines (fairseq2 wheels exist only for x86-64 on Linux);
    # arm64 is Whisper-only and says so in the build log.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build x86-64 and prove both engines are installed
        run: |
          docker buildx build --load --platform linux/amd64 -t semaje-stt:ci .
          docker run --rm --entrypoint python semaje-stt:ci -c "from semaje_stt.models import omnilingual_available; import faster_whisper; assert omnilingual_available(); print('both engines installed')"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
      - name: Publish multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
